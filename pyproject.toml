[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "taxagentbench-env"
version = "0.1.0"
description = "TaxAgentBench agent environment (MVP), Python port of the Ruby prototype"
requires-python = ">=3.10"
dependencies = ["pymupdf>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
tab = "tab.cli:agent_main"
tab-admin = "tab.cli:admin_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
